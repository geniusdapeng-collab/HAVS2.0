## 📋 templates/tech-research.md

```markdown
# 技术调研模板

## 适用场景
对比评估不同技术方案，辅助技术选型

## 调研维度

### 1. 技术原理
- 核心技术概念
- 工作原理
- 技术成熟度(TRL)

### 2. 主流方案对比
- 方案A vs 方案B vs 方案C
- 技术路线差异
- 适用场景

### 3. 性能指标
- 响应时间/吞吐量
- 资源消耗
- 扩展性

### 4. 生态与社区
- 开源社区活跃度
- 文档完善度
- 第三方工具/插件

### 5. 成本评估
- 开发成本
- 运维成本
- 学习成本

### 6. 落地案例
- 典型应用案例
- 用户规模
- 实际效果

### 7. 风险评估
- 技术风险
- 供应商锁定风险
- 维护风险

## 输出结构

```

