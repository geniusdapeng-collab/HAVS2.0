## 📋 templates/industry-research.md

```markdown
# 行业研究模板

## 适用场景
分析某一行业的市场规模、趋势、竞争格局

## 调研维度

### 1. 行业定义与分类
- 行业定义与边界
- 细分赛道分类
- 产业链位置

### 2. 市场规模与增速
- 历史市场规模
- 未来3-5年预测
- CAGR增长率

### 3. 产业链分析
- 上游供应商
- 中游制造商
- 下游渠道商
- 价值链分布

### 4. 政策环境(PEST)
- 政策 (Political)
- 经济 (Economic)
- 社会 (Social)
- 技术 (Technological)

### 5. 竞争格局
- 市场集中度(CR3/CR5)
- 主要玩家矩阵
- 竞争态势分析

### 6. 发展趋势
- 技术趋势
- 消费趋势
- 商业模式创新

### 7. 关键成功因素
- 核心竞争力
- 进入壁垒
- 盈利模式

## 输出结构

```

